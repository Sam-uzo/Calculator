<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0b1a" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="status">
        <div id="h4-div">
          <h4 class="h4-tag">Your last calculation has been stored ✅</h4>
        </div>
        <div id="select-div">
          <select
            name="previous-results"
            id="dropdown"
            aria-label="Previous results"
          >
            <option value="">Previous results</option>
            <option value="" id="first-option"></option>
            <option value="" id="second-option"></option>
            <option value="" id="third-option"></option>
            <option value="" id="fourth-option"></option>
          </select>
        </div>
      </div>

      <div class="display">
        <input
          type="text"
          value=""
          class="display-input"
          aria-label="Calculator display"
          autocomplete="off"
          readonly
        />
      </div>

      <div class="keys">
        <button type="button" class="AC" aria-label="All clear">AC</button>
        <button type="button" class="divide" aria-label="Divide">÷</button>
        <button type="button" class="multiply" aria-label="Multiply">×</button>
        <button type="button" class="delete" aria-label="Delete last digit">
          DEL
        </button>

        <button type="button" class="seven">7</button>
        <button type="button" class="eight">8</button>
        <button type="button" class="nine">9</button>
        <button type="button" class="subtract" aria-label="Subtract">−</button>

        <button type="button" class="four">4</button>
        <button type="button" class="five">5</button>
        <button type="button" class="six">6</button>
        <button type="button" class="add" aria-label="Add">+</button>

        <button type="button" class="one">1</button>
        <button type="button" class="two">2</button>
        <button type="button" class="three">3</button>
        <button type="button" class="equal" aria-label="Equals">=</button>

        <button type="button" class="percentage" aria-label="Percent">%</button>
        <button type="button" class="zero">0</button>
        <button type="button" class="dot" aria-label="Decimal point">.</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
